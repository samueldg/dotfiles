[directory]
truncation_length = 0
truncate_to_repo = false

[docker_context]
disabled = true

[gcloud]
disabled = true

[kubernetes]
disabled = false
detect_env_vars = [
    "STARSHIP_ENABLE_MODULE_KUBERNETES",
]
contexts = [
    { context_pattern = ".*-devops.*", context_alias = "devops", style = "blue bold" },
    { context_pattern = ".*-staging.*", context_alias = "staging", style = "yellow bold" },
    { context_pattern = ".*-prod.*", context_alias = "prod", style = "red bold" },
]

[package]
disabled = true

# Customize the claude-code profile
[profiles]
claude-code = "$claude_model$claude_context$claude_cost"

# Configure individual modules
[claude_model]
format = "[$symbol$model]($style) "
symbol = "🤖 "
style = "bold blue"

[claude_context]
format = "[$gauge $percentage]($style) "
gauge_width = 10

[claude_cost]
format = "[$symbol$cost]($style) "
symbol = "💰 "
